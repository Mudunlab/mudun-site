<style>
/* Layout: full-screen city map under a bottom sheet. The student draws their trip leg by leg on the map; #live is a full-screen booth display. Single light "limestone" world, matching Mudun's print maps. */
:root{
  --limestone:#f3eee4; --paper:#fffdf8; --asphalt:#232323; --ink2:#55524b; --line:#d9cfbd; --soft:#ece5d7;
  --green:#27B38D; --green-deep:#17795c; --sand:#d9c7a6; --sky:#86C1E0; --rust:#b5482e; --amber:#E0A100;
  --f-ar:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --f-num:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--limestone);color:var(--asphalt);font-family:var(--f-ar);overflow:hidden}
#map{position:fixed;inset:0;background:var(--limestone);z-index:0}
.leaflet-container{background:var(--limestone);font-family:var(--f-ar)}
.leaflet-control-attribution{font:11px var(--f-num);background:rgba(255,253,248,.85)!important;color:var(--ink2)}
.leaflet-control-attribution a{color:var(--ink2)}
.leaflet-control-zoom{display:none}
.osm-tiles{filter:saturate(.55) sepia(.12) brightness(1.02) contrast(.95)}
.leaflet-top{top:calc(92px + env(safe-area-inset-top,0px))}

.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;font-weight:700;font-size:13px}
.brand b{color:var(--green-deep)}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.top button{pointer-events:auto}
.lang{font:700 12px var(--f-num);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--asphalt);cursor:pointer}
.demo{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));z-index:20;font-size:11.5px;font-weight:600;background:#fdf1d6;border:1px solid #e9cf8c;color:#6b4e00;border-radius:8px;padding:4px 9px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 30px rgba(35,35,35,.13);max-height:70%;overflow-y:auto;overscroll-behavior:contain;
  padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.wrap{max-width:560px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:14px}
.prog{display:flex;gap:5px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--soft)}
.prog i.on{background:var(--green)}
.eyebrow{font:700 11px var(--f-num);letter-spacing:.08em;color:var(--green-deep);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--green-deep)}
h2{font-size:21px;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0;line-height:1.6;color:var(--ink2);font-size:15px}
.small{font-size:12.5px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 14.5px var(--f-ar);border:1.5px solid var(--line);background:var(--paper);color:var(--asphalt);border-radius:12px;padding:9px 12px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{border-color:var(--asphalt);background:var(--asphalt);color:var(--paper)}
.chip .sw{width:10px;height:10px;border-radius:3px;flex:none}
.chip:focus-visible,.btn:focus-visible,.lang:focus-visible,.face:focus-visible,.link:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn{font:700 16px var(--f-ar);border:0;border-radius:14px;padding:13px 16px;background:var(--green-deep);color:#fff;cursor:pointer;min-height:50px;width:100%}
.btn[disabled]{background:#cfc6b6;cursor:default}
.btn.ghost{background:transparent;color:var(--asphalt);border:1.5px solid var(--line)}
.btn.dark{background:var(--asphalt)}
.link{font:600 13.5px var(--f-ar);background:none;border:0;color:var(--green-deep);text-decoration:underline;cursor:pointer;padding:4px 0;align-self:center}
.row{display:flex;gap:10px}
.row>*{flex:1}
label.q{font-weight:700;font-size:15px;display:block;margin-bottom:8px}
input[type=text]{font:500 15px var(--f-ar);width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--asphalt)}
.pill{display:inline-flex;align-items:center;justify-content:center;font:700 12px var(--f-num);color:#fff;border-radius:999px;padding:4px 9px;direction:ltr;min-width:40px}
.near{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.nl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.nl small{font:600 12px var(--f-num);color:var(--ink2);white-space:nowrap}
.callout{border-radius:14px;padding:12px 14px;background:#eef6f2;border:1px solid #cfe7dd;font-size:14px;line-height:1.55}
.callout.warn{background:#fbf1e9;border-color:#efd5c2}

/* trip chain */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;direction:inherit}
.seg{display:inline-flex;align-items:center;gap:5px;border-radius:10px;padding:5px 8px;font:700 12.5px var(--f-ar);background:var(--soft);color:var(--asphalt)}
.seg.ride{color:#fff}
.seg em{font:700 12px var(--f-num);font-style:normal;opacity:.9}
.seg.wait{background:#fbeede;color:#8a4b12}
.arrow{color:var(--ink2);font:700 13px var(--f-num)}
.tbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}
.tbar i{display:block;height:100%}
.tot{display:flex;align-items:baseline;gap:8px}
.tot b{font:800 40px/1 var(--f-num);font-variant-numeric:tabular-nums}
.tot span{font-weight:700;color:var(--ink2)}
.step-tag{font:700 12px var(--f-ar);color:var(--green-deep)}
.fac{transform:translate(-50%,-50%);white-space:nowrap;font:700 11.5px var(--f-ar);background:rgba(255,253,248,.92);border:1.5px solid #17795c;color:#17795c;border-radius:9px;padding:3px 7px;cursor:pointer}
.fac.on{background:#17795c;color:#fff}
.facdot{transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fffdf8;border:3px solid #17795c;cursor:pointer}
.sheet.short{max-height:50%}.sheet.short .chip{min-height:36px;padding:6px 10px;font-size:13.5px}
label.q.grp{font-size:13px;color:var(--green-deep);margin:4px 0 6px}
textarea{font:500 15px var(--f-ar);width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--asphalt);resize:vertical}
.pick{border:2px dashed var(--green-deep);border-radius:14px;padding:12px;text-align:center;font-weight:700;color:var(--green-deep);background:#f1f8f4}

.big{font:800 60px/1 var(--f-num);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--asphalt)}
.big small{font:700 18px var(--f-ar);color:var(--ink2);margin-inline-start:6px;letter-spacing:0}
.big.empty{color:#cfc6b6}
input[type=range]{width:100%;accent-color:var(--green-deep);height:30px}
.scale{display:flex;justify-content:space-between;font:600 11px var(--f-num);color:var(--ink2);direction:ltr}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.face{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 20px var(--f-num);color:var(--asphalt)}
.face span{font:600 10.5px var(--f-ar);color:var(--ink2)}
.face[aria-pressed="true"]{background:var(--green-deep);border-color:var(--green-deep);color:#fff}
.face[aria-pressed="true"] span{color:#e6f4ee}
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:800 30px/1.1 var(--f-num);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink2)}
.bar{position:relative;height:12px;border-radius:8px;background:linear-gradient(90deg,var(--green),var(--sand),var(--rust));direction:ltr}
.bar i{position:absolute;top:-5px;width:4px;height:22px;border-radius:3px;background:var(--asphalt);transform:translateX(-2px)}
.bar i.g{background:var(--sky)}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.legend .bar{flex:1;height:8px}
.card-img{width:100%;max-width:300px;margin:0 auto;border-radius:16px;border:1px solid var(--line);display:block}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.logos{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:4px;border-bottom:1px solid var(--line)}
.logos img{height:30px;width:auto;display:block}
.logos .mud{display:flex;align-items:center;gap:6px;font:700 15px var(--f-ar);color:var(--green-deep)}
.logos .mud img{height:22px}
.logos .av{font:600 12.5px var(--f-ar);color:var(--ink2)}
.logos .av img{height:28px}
.live .logos{border:0;padding:0}
.search .fld{position:relative}
.search input{padding-inline-start:38px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink2)}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.results button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:11px 12px;font:600 14.5px var(--f-ar);border-top:1px solid var(--soft);background:var(--paper)}
.results button:first-child{border-top:0}
.results button:focus-visible{outline:3px solid var(--sky);outline-offset:-3px}
.results small{color:var(--ink2);font-weight:500;font-size:12px}
.plabel{font:600 12px var(--f-ar);color:#4a463f;white-space:nowrap;pointer-events:none;text-shadow:0 0 3px #f3eee4,0 0 3px #f3eee4,0 0 6px #f3eee4;transform:translate(-50%,-50%);opacity:.9}
.plabel.t1{font-size:15px;font-weight:700;color:#2f2c27;letter-spacing:.02em}
.plabel.t2{font-size:13px}
.plabel.t3{font-size:11.5px;font-weight:500;color:#6a655b}
.ujlabel{font:700 12px var(--f-ar);color:var(--asphalt);background:var(--paper);border:1.5px solid var(--asphalt);border-radius:999px;padding:3px 9px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tp{font:700 11px var(--f-num);color:#fff;background:var(--asphalt);border:2px solid var(--paper);border-radius:999px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.hint{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:var(--asphalt);color:var(--paper);font-weight:700;font-size:13px;border-radius:999px;padding:8px 14px;pointer-events:none;white-space:nowrap}

/* booth display (#live) */
.live{position:fixed;z-index:40;inset-block:auto 0;inset-inline:0;pointer-events:none;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.live .panel{pointer-events:auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 22px;box-shadow:0 8px 30px rgba(35,35,35,.12)}
.live .count{font:800 clamp(48px,9vw,110px)/.95 var(--f-num);font-variant-numeric:tabular-nums;color:var(--green-deep)}
.live .lbl{font-weight:700;font-size:clamp(15px,2vw,22px)}
.live .avg{font:800 clamp(28px,4vw,48px)/1 var(--f-num)}
.ticker{flex:1;min-width:260px;display:flex;flex-direction:column;gap:8px;max-height:40vh;overflow:hidden}
.tk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:clamp(13px,1.5vw,17px)}
.tk b{font:800 1.2em var(--f-num);min-width:3.2em}
.cta{font-weight:700;font-size:clamp(15px,2vw,22px)}
.cta small{display:block;font:700 1.3em var(--f-num);color:var(--green-deep);direction:ltr}
[dir=ltr] .chip,[dir=ltr] .btn,[dir=ltr] input{font-family:var(--f-num)}
</style>

let LANG='ar'; const t=()=>T[LANG];
const logosHTML=()=>`<div class="logos"><img src="${LOGO.mwc}" alt="${LANG==='ar'?'تنقّل بثقة':'Mobility with Confidence'}"><span class="mud"><img src="${LOGO.mudun}" alt="مدن">${LANG==='ar'?'لاب':'Lab'}</span>${LOGO.av?`<span class="av"><img src="${LOGO.av}" alt="Amman Vision"></span>`:`<span class="av">${LANG==='ar'?'بالتعاون مع رؤية عمّان':'with Amman Vision'}</span>`}</div>`;
const IMG={};['mwc','mudun','av'].forEach(k=>{if(LOGO[k]){const i=new Image();i.src=LOGO[k];IMG[k]=i;}}); const ml=m=>MODES[m][LANG==='ar'?'ar':'en'];
const lineBy=c=>DATA.lines.find(l=>l.c===c);

/* ================= state ================= */
const fresh=()=>({step:0,role:null,home:null,area:'',near:[],legs:[],cur:{mode:null,line:null,other:'',otherOk:false,to:null,toUJ:false,wait:null,dur:null},quick:false,qtime:null,cost:null,guess:null,problems:[],conf:null,dest:null,lm:null,lmin:null,app:null,fix:''});
let S=fresh();

/* ================= map ================= */
const map=Lf.map('map',{zoomControl:false,preferCanvas:true,minZoom:9,maxZoom:17}).setView([31.97,35.90],11);
map.attributionControl.setPosition('topleft');map.attributionControl.setPrefix(false).addAttribution('Lines: Amman Vision');
const R=Lf.canvas({padding:0.3});
map.createPane('base');map.getPane('base').style.zIndex=250;
const RB=Lf.canvas({padding:0.3,pane:'base'});
/* Basemap: full street map tiles (every street, neighbourhood names) on the live site.
   Where tiles can't load, fall back to our own OpenStreetMap street data, with all streets shown from zoom 13. */
const tiles=Lf.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,className:'osm-tiles',attribution:'© OpenStreetMap contributors'}).addTo(map);
let tileOk=0,tileErr=0,vector=false;
tiles.on('tileload',()=>tileOk++);tiles.on('tileerror',()=>{if(++tileErr>2&&!tileOk)useVector();});
setTimeout(()=>{if(!tileOk)useVector();},3500);
const rs={1:{c:'#e3dac8',w:1},2:{c:'#d3c8b2',w:1.6},3:{c:'#bdb19a',w:2.4}};
function useVector(){
  if(vector)return;vector=true;map.removeLayer(tiles);map.attributionControl.addAttribution('Roads © OpenStreetMap');
  if(window._placesWaiting){window._placesWaiting=false;map.on('zoomend moveend',paintPlaces);setTimeout(paintPlaces,0);}
  [1,2,3].forEach(k=>DATA.roads[k].forEach(g=>Lf.polyline(g,{renderer:RB,color:rs[k].c,weight:rs[k].w,interactive:false}).addTo(map)));
  map.on('moveend zoomend',paintStreets);paintStreets();
}
/* street data (side file): decoded into ~2 km buckets */
const BK=0.02, buckets={}, bucketLayers={}; let STR=null;
function decode(str){let i=0,lat=0,lon=0,out=[];while(i<str.length){for(const k of [0,1]){let b,sh=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5;}while(b>=0x20);const d=(r&1)?~(r>>1):(r>>1);if(k===0)lat+=d;else lon+=d;}out.push([lat/1e5,lon/1e5]);}return out;}
function onStreets(){
  const D=window.STREETS;if(!D)return;STR=D;
  const add=(arr,kind)=>arr.forEach(([e,n])=>{const g=decode(e);const k=Math.floor(g[0][0]/BK)+'_'+Math.floor(g[0][1]/BK);(buckets[k]=buckets[k]||[]).push({g,n,kind});});
  add(D.fab,'fab');add(D.main,'main');
  if(vector)paintStreets();
  if(PL.length)buildIndex();
  if(S.home&&!S.homeStreet){S.homeStreet=streetNear(S.home);render();}
}
(function(){const sc=document.createElement('script');sc.src='streets.js';sc.onload=onStreets;document.head.appendChild(sc);})();
function paintStreets(){
  if(!STR)return;const z=map.getZoom(),b=map.getBounds().pad(0.3);
  const want=new Set();
  if(z>=13){for(let la=Math.floor(b.getSouth()/BK);la<=Math.floor(b.getNorth()/BK);la++)for(let lo=Math.floor(b.getWest()/BK);lo<=Math.floor(b.getEast()/BK);lo++)want.add(la+'_'+lo);}
  for(const k in bucketLayers)if(!want.has(k)){map.removeLayer(bucketLayers[k]);delete bucketLayers[k];}
  want.forEach(k=>{if(bucketLayers[k]||!buckets[k])return;bucketLayers[k]=Lf.layerGroup(buckets[k].filter(f=>f.kind==='fab').map(f=>Lf.polyline(f.g,{renderer:RB,color:z>=15?'#cbbfa8':'#d6ccb8',weight:z>=16?2.6:z>=15?1.8:1.1,interactive:false}))).addTo(map);});
}
/* area names (side file places.js): tiered by zoom, culled so labels never pile up */
const TIER={city:1,town:1,suburb:2,village:2,quarter:3,neighbourhood:3,hamlet:3};
const MINZ={1:9,2:12,3:14};
const plLayer=Lf.layerGroup().addTo(map);let PL=[];
function onPlaces(){
  const D=window.PLACES;if(!D||!D.length)return;
  PL=D.map(p=>({n:p.n,ne:p.ne||p.n,la:p.la,lo:p.lo,t:TIER[p.t]||3})).sort((a,b)=>a.t-b.t);
  buildIndex();
  if(window.PLACES_APPROX&&!vector){window._placesWaiting=true;return;}
  map.on('zoomend moveend',paintPlaces);paintPlaces();
}
function paintPlaces(){
  plLayer.clearLayers();const z=map.getZoom(),b=map.getBounds().pad(0.1),boxes=[];
  for(const p of PL){
    if(z<MINZ[p.t]||!b.contains([p.la,p.lo]))continue;
    const name=LANG==='ar'?p.n:p.ne,pt=map.latLngToContainerPoint([p.la,p.lo]),fs=p.t===1?15:p.t===2?13:11.5;
    const wd=name.length*fs*0.62+16,ht=fs+12,box=[pt.x-wd/2,pt.y-ht/2,pt.x+wd/2,pt.y+ht/2];
    if(boxes.some(q=>!(box[2]<q[0]||box[0]>q[2]||box[3]<q[1]||box[1]>q[3])))continue;
    boxes.push(box);
    plLayer.addLayer(Lf.marker([p.la,p.lo],{interactive:false,keyboard:false,icon:Lf.divIcon({className:'',iconSize:null,html:`<div class="plabel t${p.t}">${esc(name)}</div>`})}));
    if(boxes.length>(z>=15?30:z>=13?40:25))break;
  }
}
setTimeout(()=>{if(!IDX.length)buildIndex();},0);
(function(){const sc=document.createElement('script');sc.src='places.js';sc.onload=onPlaces;sc.onerror=()=>{};document.head.appendChild(sc);})();
/* search: area names + every named street */
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/^(شارع|ش\.)\s*/,'').trim();
let IDX=[];
function buildIndex(){
  IDX=[];PL.forEach(p=>IDX.push({k:norm(p.n)+' '+norm(p.ne),ar:p.n,en:p.ne,pt:[p.la,p.lo],z:p.t===1?12:14,kind:'area'}));
  {const seen=new Set();(DATA.stops||[]).forEach(st=>{const nm=st[3];if(!nm||seen.has(nm))return;seen.add(nm);IDX.push({k:norm(nm),ar:nm,en:nm,pt:[st[0],st[1]],z:16,kind:'stop'});});}
  if(STR){const seen=new Set();for(const k in buckets)for(const f of buckets[k]){if(f.n<0||seen.has(f.n))continue;seen.add(f.n);const nm=STR.names[f.n];IDX.push({k:norm(nm),ar:nm,en:nm,pt:f.g[Math.floor(f.g.length/2)],z:16,kind:'street'});}}
}
function searchFor(q){q=norm(q);if(q.length<2)return[];const a=[],b=[];for(const it of IDX){const i=it.k.indexOf(q);if(i<0)continue;(i===0||it.k[i-1]===' '?a:b).push(it);if(a.length>=12)break;}
  const rk={area:0,stop:1,street:2};return [...a,...b].sort((x,y)=>rk[x.kind]-rk[y.kind]).slice(0,6);}
function bindSearch(id,boxId,onPick){
  const x=t(),q=document.getElementById(id);if(!q)return;

const KX=Math.cos(32*Math.PI/180)*111320, KY=111320;
const dist=(a,b)=>Math.hypot((a[1]-b[1])*KX,(a[0]-b[0])*KY);
function projSeg(p,a,b){const ax=(a[1]-p[1])*KX,ay=(a[0]-p[0])*KY,bx=(b[1]-p[1])*KX,by=(b[0]-p[0])*KY,dx=bx-ax,dy=by-ay;const u=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/((dx*dx+dy*dy)||1)));return {d:Math.hypot(ax+u*dx,ay+u*dy),u,pt:[a[0]+u*(b[0]-a[0]),a[1]+u*(b[1]-a[1])]};}
function nearestOn(g,p){let best={d:1e9};for(let i=1;i<g.length;i++){const r=projSeg(p,g[i-1],g[i]);if(r.d<best.d)best={d:r.d,i,pt:r.pt};}return best;}
function distToLine(p,l){return Math.min(...l.g.map(g=>nearestOn(g,p).d));}
const snap=v=>Math.round(v/GRID)*GRID;
// real path along a known line between two points (picks the direction that runs from a to b)
function routePath(code,a,b){
  const l=lineBy(code); if(!l) return null; let best=null;
  for(const g of l.g){const A=nearestOn(g,a),B=nearestOn(g,b);if(A.d>SNAP_M||B.d>SNAP_M||A.i>B.i)continue;
    const s=A.d+B.d;if(!best||s<best.s)best={s,path:[A.pt,...g.slice(A.i,B.i),B.pt]};}
  return best&&best.path;
}
function curve(a,b){const m=[(a[0]+b[0])/2+(b[1]-a[1])*.15,(a[1]+b[1])/2-(b[0]-a[0])*.15],o=[];for(let i=0;i<=30;i++){const u=i/30;o.push([(1-u)*(1-u)*a[0]+2*(1-u)*u*m[0]+u*u*b[0],(1-u)*(1-u)*a[1]+2*(1-u)*u*m[1]+u*u*b[1]]);}return o;}
const legColor=lg=>lg.line&&lineBy(lg.line)?lineBy(lg.line).col:MODES[lg.mode].col;
function legShape(lg){
  if(lg.line&&lineBy(lg.line)){const p=routePath(lg.line,lg.from,lg.to);if(p)return {path:p,real:true};}
  return {path:curve(lg.from,lg.to),real:false};
}

const tcol=v=>{const s=[[20,[39,179,141]],[50,[217,199,166]],[90,[181,72,46]]];if(v<=s[0][0])return`rgb(${s[0][1]})`;for(let i=1;i<s.length;i++){if(v<=s[i][0]){const u=(v-s[i-1][0])/(s[i][0]-s[i-1][0]);return`rgb(${s[i-1][1].map((c,k)=>Math.round(c+(s[i][1][k]-c)*u))})`;}}return`rgb(${s[2][1]})`;};

  return Lf.layerGroup(Object.values(cells).map(c=>Lf.rectangle([[c.la,c.lo],[c.la+G,c.lo+G]],{renderer:R,weight:.6,color:'#fffdf8',fillColor:tcol(c.s/c.n),fillOpacity:.82,interactive:false})));}

    <div class="panel"><div class="count">${data.length}</div><div class="lbl">${x.trips}</div></div>
    <div class="panel"><div class="avg">${avg}</div><div class="lbl">${x.avg}</div></div>
    <div class="panel ticker"><div class="lbl">${x.latest}</div>${latest.map(r=>`<div class="tk"><b style="color:${tcol(r.time)}">${r.time}</b><span>${esc(fmtChain(r.chain))}</span></div>`).join('')}</div>
    <div class="panel cta">${x.cta}<small>mudunlab.org/uj</small></div>
    <div class="panel">${logosHTML()}</div>`;
}
function startLive(){document.getElementById('sheet').hidden=true;document.getElementById('live').hidden=false;
  map.fitBounds([[31.83,35.78],[32.09,36.10]],{paddingBottomRight:[0,220],paddingTopLeft:[0,70]});liveTick();setInterval(liveTick,20000);}

document.getElementById('lang').onclick=()=>{LANG=LANG==='ar'?'en':'ar';paintPlaces();if(location.hash==='#live')liveTick();else render();};
if(location.hash==='#live')startLive();else render();
</script>
